const story="בְּיוֹם שְׁלִישִׁי הִגִּיעָה נוֹעָה לַכִּתָּה וְגִלְּתָה שֶׁמַּחְבֶּרֶת הָעִבְרִית שֶׁלָּהּ נֶעֶלְמָה. הִיא חִפְּשָׂה בַּתִּיק וּמִתַּחַת לַשֻּׁלְחָן, אַךְ לֹא מָצְאָה אוֹתָהּ. חֲבֶרְתָּהּ מִיָּה הִבְחִינָה שֶׁנּוֹעָה עֲצוּבָה וְהִצִּיעָה לַעֲזֹר לָהּ. הַשְּׁתַּיִם חִפְּשׂוּ יַחַד, וּלְבַסּוֹף מָצְאוּ אֶת הַמַּחְבֶּרֶת בַּסִּפְרִיָּה. נוֹעָה הוֹדְתָה לְמִיָּה עַל עֶזְרָתָהּ.";

let key='',index=0,score=0,locked=false;const $=id=>document.getElementById(id);let saved=JSON.parse(localStorage.getItem('wordAdventureV1')||'{}');$('name').value=saved.name||'';$('name').oninput=()=>{saved.name=$('name').value;persist()};function persist(){localStorage.setItem('wordAdventureV1',JSON.stringify(saved));$('stars').textContent='⭐ כּוֹכָבִים שֶׁנִּצְבְּרוּ: '+(saved.stars||0)}persist();function home(){$('home').classList.remove('hidden');$('play').classList.add('hidden')}function start(k){key=k;index=0;score=0;$('home').classList.add('hidden');$('play').classList.remove('hidden');render()}function render(){locked=false;const q=sets[key][index];$('title').textContent=key;$('counter').textContent=`שְׁאֵלָה ${index+1} מִתּוֹךְ ${sets[key].length}`;$('bar').style.width=(100*index/sets[key].length)+'%';$('story').classList.toggle('hidden',!['קריאה והבנה','מאזכרים','אוצר מילים','תכונות אופי','רצף אירועים'].includes(key));$('story').textContent=story;$('question').textContent=q.q;$('feedback').textContent='';$('next').classList.add('hidden');$('choices').innerHTML='';q.a.forEach((a,i)=>{const b=document.createElement('button');b.textContent=a;b.onclick=()=>answer(i);$('choices').append(b)})}function answer(i){if(locked)return;locked=true;const q=sets[key][index],ok=i===q.c;if(ok)score++;$('feedback').textContent=(ok?'נָכוֹן מְאֹד! ⭐ ':'נְנַסֶּה לִלְמֹד מִזֶּה. ')+q.e;[...$('choices').children].forEach((b,j)=>{b.disabled=true;if(j===q.c)b.style.background='#c6f4d4';else if(j===i)b.style.background='#ffd8d8'});$('next').classList.remove('hidden');$('next').textContent=index===sets[key].length-1?'סִיּוּם הַמַּסְלוּל':'לַשְּׁאֵלָה הַבָּאָה ←'}function next(){index++;if(index>=sets[key].length){saved.stars=(saved.stars||0)+score;persist();$('story').classList.add('hidden');$('question').textContent=`כָּל הַכָּבוֹד${saved.name?' '+saved.name:''}! סִיַּמְתָּ אֶת הַמַּסְלוּל עִם ${score} מתוך ${sets[key].length} תְּשׁוּבוֹת נְכוֹנוֹת! 🎉`;$('choices').innerHTML='';$('feedback').textContent='הַכּוֹכָבִים נִשְׁמְרוּ.';$('next').classList.add('hidden');$('bar').style.width='100%';return}render()}Object.keys(sets).forEach(k=>{const b=document.createElement('button');b.textContent='✨ '+k;b.onclick=()=>start(k);$('menu').append(b)});
</script></body></html>
